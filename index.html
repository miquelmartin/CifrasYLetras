<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cifras y Letras</title>
  <meta name="theme-color" content="#eef5fb">
  <link rel="icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" sizes="180x180">
  <link rel="manifest" href="site.webmanifest?v=4">
  <style>
    :root { color-scheme: light; font: 16px/1.4 system-ui, sans-serif; background: #eef5fb; color: #1d2a44; --ink: #1d2a44; --muted: #3f6fc4; --blue: #3f6fc4; --orange: #f4a77c; --amber: #f6c96b; --line: #2b3a5a; --soft: #f7fafd; --operator: #5b84d1; --target: #e2733a; --result: #8fb0e6; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; padding: 12px; }
    main { max-width: 760px; height: calc(100vh - 24px); height: calc(100dvh - 24px); min-height: 480px; margin: auto; display: flex; flex-direction: column; gap: 10px; }
    h2 { font-size: 1.05rem; margin: 0; }
    p { color: var(--muted); margin: 0; }
    .card { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
    label { display: block; font-weight: 650; margin-bottom: 4px; }
    input { min-width: 0; width: 100%; background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
    input::placeholder { color: #586d80; opacity: 1; }
    :focus, :focus-visible { outline: none; }
    button:focus-visible, a:focus-visible { filter: brightness(.86); }
    .hint { display: block; font-size: .875rem; color: var(--muted); margin: 8px 0; }
    .buttons { display: flex; gap: 8px; margin-top: 10px; }
    button { min-height: 44px; border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-weight: 700; cursor: pointer; background: var(--orange); color: var(--ink); box-shadow: 2px 2px 0 var(--line); }
    .buttons button { flex: 1; }
    button.secondary { background: #fff; color: var(--blue); }
    button:disabled { background: #e7eef6; color: #4d607c; box-shadow: none; cursor: not-allowed; }
    #status, #letters-status { margin-top: 4px; font-size: .875rem; max-height: 3.9em; overflow: hidden; overflow-wrap: anywhere; }
    #status.error, #letters-status.error { color: #a52826; }
    a { color: var(--blue); text-underline-offset: 3px; }
    .tabs { position: relative; flex: 0 0 auto; display: flex; gap: 4px; padding: 4px; background: #fff; border: 2px solid var(--line); border-radius: 12px; }
    .tabs button { flex: 1; min-width: 0; background: transparent; color: var(--ink); border: 0; box-shadow: none; }
    #numbers-tab { padding-right: 38px; }
    #letters-tab { padding-left: 38px; }
    .tabs button[aria-selected="true"] { background: var(--amber); color: var(--ink); }
    .tabs img { position: absolute; left: 50%; top: 50%; z-index: 1; width: 78px; height: 78px; transform: translate(-50%, -50%); filter: drop-shadow(0 1px 2px rgba(43, 58, 90, .35)); pointer-events: none; user-select: none; }
    #letters-solver:not(.letters-busy):not(.letter-results) #letters-source { display: none; }
    [role="tabpanel"] { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    form.card { flex: 0 0 auto; }
    #letters-result { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
    .result-scroll { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    #summary, #letters-summary { font-size: .875rem; overflow-wrap: anywhere; }
    .word-list { margin: 0; padding: 3px; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(124px, 1fr)); gap: 6px; align-content: start; }
    .word-list li { display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border: 2px solid var(--line); border-radius: 9px; background: #fff; overflow-wrap: anywhere; }
    .word-list strong { flex: 1; min-width: 0; font-size: 1rem; color: var(--ink); }
    .word-list a { display: grid; place-items: center; flex: 0 0 44px; min-height: 44px; border-radius: 6px; }
    .word-list a:hover { background: #eef5fb; }
    .word-list svg { width: 18px; height: 18px; }
    .notice { font-size: .875rem; color: var(--muted); }
    .caveat { font-size: .875rem; margin-top: 6px; }
    .manual > .tabs, .manual > [role="tabpanel"] { display: none !important; }
    #calculator-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
    .calculator-toolbar { display: flex; align-items: stretch; gap: 8px; height: 72px; flex: 0 0 auto; }
    #calculator-back { flex: 0 0 64px; height: 72px; padding: 0; display: grid; place-items: center; }
    .calculator-goal { flex: 1; min-width: 0; display: flex; }
    .calculator-target { flex: 1; min-width: 0; height: 72px; overflow: hidden; background: #fff; color: var(--target); border: 2px solid var(--line); padding: 1px 8px; border-radius: 8px; font-weight: 700; }
    .target-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
    #calculator-title { display: block; font-size: .7rem; line-height: 1.1; color: var(--blue); }
    #calculator-target { display: block; flex: 0 1 auto; min-width: 0; font-size: 2.875rem; line-height: 1.15; overflow: hidden; white-space: nowrap; }
    #calculator-distance { flex: 0 0 auto; max-width: 45%; margin: 0; color: #6b3f12; font-size: 1rem; font-weight: 800; line-height: 1.1; overflow: hidden; overflow-wrap: anywhere; max-height: 2.2em; }
    #calculator-display { background: var(--soft); border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--line); border-radius: 8px; padding: 4px; font: clamp(1.75rem, 7vw, 3rem)/1.15 ui-monospace, monospace; color: var(--ink); overflow-wrap: anywhere; height: 60px; min-height: 60px; max-height: 60px; overflow: hidden; }
    .calculator-controls { flex: 0 0 auto; overflow: hidden; padding: 8px; }
    .calculator-readout { margin-bottom: 6px; }
    #calculator-keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
    #calculator-keys button { min-height: clamp(44px, 7dvh, 64px); min-width: 0; font-size: clamp(1.75rem, 8vw, 2.8rem); line-height: 1.3; padding: 4px; white-space: normal; overflow-wrap: anywhere; }
    .calculator-operators { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
    .calculator-operators button { min-height: 56px; padding: 0; font-size: 2rem; background: var(--operator); color: #fff; }
    .calculator-operators button.secondary { background: #fff; color: var(--blue); }
    .calculator-operators #calculator-undo { background: #fff; color: var(--blue); }
    .calculator-operators button:disabled { background: #cbd9f0; color: #4d607c; border-style: dashed; }
    .calculator-operators button[aria-pressed="true"] { filter: brightness(.86); }
    .calculator-footer { flex: 0 0 auto; display: flex; justify-content: flex-end; margin-top: 6px; }
    #calculator-auto { flex: 0 0 auto; min-height: 44px; padding: 4px 14px; font-size: .875rem; font-weight: 650; background: #fff; color: var(--blue); }
    #calculator-undo { flex: 0 0 52px; line-height: 1; }
    #calculator-status { font-size: .875rem; margin-top: 4px; max-height: 2.8em; overflow: hidden; }
    .error { color: #a52826; }
    .success { color: var(--ink); font-weight: 700; }
    .target-reached #calculator-display { background: var(--amber); }
    .celebration { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #calculator-steps { padding: 3px; margin: 0; list-style: none; counter-reset: manual-step; display: flex; flex-direction: column; gap: 6px; }
    #calculator-steps li { counter-increment: manual-step; display: flex; gap: 8px; align-items: center; overflow-wrap: anywhere; padding: 8px; border: 2px solid var(--line); border-radius: 9px; background: var(--soft); }
    #calculator-steps li::before { content: counter(manual-step); display: grid; place-items: center; flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--amber); color: var(--ink); font-size: .8rem; }
    #calculator-history { flex: 1; min-height: 96px; padding: 4px 8px; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
    #calculator-history h2 { flex: 0 0 auto; font-size: .875rem; color: var(--blue); }
    #calculator-steps li { font-size: 1.1rem; line-height: 1.3; padding: 6px; }
    #calculator-steps li::before { flex-basis: 30px; height: 30px; background: var(--blue); color: #fff; font-size: 1.2rem; }
    .step-derived { color: var(--blue); font-weight: 800; }
    .operation { color: var(--ink); }
    .step-value { background: var(--amber); color: var(--ink); border-radius: 4px; padding: 0 3px; font-weight: 800; }
    #calculator-keys { padding: 0 3px 3px 0; margin-top: 4px; }
    #calculator-keys button { position: relative; background: var(--orange); color: var(--ink); border: 2px solid var(--line); }
    #calculator-keys button:disabled { background: #f6d5c1; color: var(--ink); box-shadow: none; }
    #calculator-keys button[aria-pressed="true"] { filter: brightness(.86); }
    #calculator-keys button.result-key { background: var(--result); color: var(--ink); border-style: double; padding-right: 12px; }
    #calculator-keys button.result-key:disabled { background: #d6e1f3; }
    #calculator-keys button.result-key::after { content: attr(data-marker); position: absolute; top: 1px; right: 3px; font: 700 .75rem/1.2 system-ui, sans-serif; }
    .supplied-numbers { display: flex; gap: 4px; flex-wrap: wrap; max-height: 60px; overflow: hidden; flex-shrink: 0; list-style: none; margin: 0; padding: 2px; }
    .supplied-numbers li { border: 2px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--orange); color: var(--ink); font-size: .875rem; overflow-wrap: anywhere; max-width: 100%; }
    .supplied-numbers li.used { background: #f7dfd0; color: #77513c; text-decoration: line-through; }
    #calculator-originals { gap: 2px; }
    #calculator-originals li { font-size: .7rem; line-height: 1.1; border-width: 2px; padding: 0 3px; }
    .key-legend { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    #numbers-fieldset, #letters-fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    #solver.keypad-form, #letters-solver.keypad-form { flex: 1; min-height: 0; max-height: none; overflow: visible; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    #solver.keypad-form #numbers-fieldset, #letters-solver.keypad-form #letters-fieldset { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .entry-slots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; flex: 0 0 auto; }
    .entry-slot { display: grid; place-items: center; height: 44px; min-height: 44px; min-width: 0; padding: 2px; border: 2px solid var(--line); border-radius: 9px; box-shadow: 2px 2px 0 var(--line); font-weight: 800; background: #fff; }
    .entry-slot.done { background: var(--orange); }
    .entry-slot.letter-slot { background: var(--amber); }
    #letter-slots { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
    #letter-slots .entry-slot { padding: 0; border-radius: 7px; font-size: clamp(.85rem, 4.4vw, 1.25rem); }
    #letter-pad button:disabled:not(.delete-key):not(.enter-key) { background: #e7eef6; color: #4d607c; border-style: dashed; box-shadow: none; }
    .entry-slot.empty, .entry-slot:disabled { background: #f7fafd; border-color: #a7b6ca; box-shadow: none; }
    .entry-slot.current { background: #fff; border: 2px dashed var(--blue); color: var(--ink); box-shadow: none; }
    #number-slots .entry-slot { font-size: 1.15rem; line-height: 1; overflow: hidden; white-space: nowrap; }
    #number-slots .entry-slot.current { font-size: 1.4rem; }
    #number-slots .entry-slot.len-3 { font-size: 1.05rem; }
    #number-slots .entry-slot.len-4 { font-size: .85rem; }
    #number-slots .entry-slot.len-long { font-size: .7rem; }
    .entry-target { flex: 0 0 auto; height: 60px; min-width: 0; margin: 0; border: 2px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 2px 2px 0 var(--line); padding: 2px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink); -webkit-tap-highlight-color: transparent; }
    .entry-target > span:first-child { color: var(--blue); font-weight: 900; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; }
    .entry-target > span:last-child { min-width: 0; overflow: hidden; white-space: nowrap; text-align: right; font-size: 2.6rem; font-weight: 900; line-height: 1; color: #e2733a; }
    .entry-target.long > span:last-child { font-size: 1.5rem; }
    .entry-target.empty { border: 2px dashed #a7b6ca; background: #f7fafd; box-shadow: none; }
    .entry-target.empty > span:last-child { color: #a7b6ca; }
    .entry-target.current { border: 2px dashed var(--blue); background: #fff; box-shadow: none; }
    .entry-target:disabled { opacity: 1; cursor: default; }
    .entry-pad { display: grid; flex: 1; min-height: 0; gap: 8px; padding: 0 3px 3px 0; }
    .number-pad { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }
    .letter-pad { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); }
    .entry-pad button { min-height: 0; min-width: 0; padding: 2px; border-radius: 12px; background: #fff; color: var(--ink); font-size: clamp(1.75rem, 5dvh, 3rem); font-weight: 800; touch-action: manipulation; user-select: none; }
    .entry-pad button.enter-key { background: var(--orange); font-size: clamp(1rem, 3.6dvh, 1.6rem); }
    .entry-pad button.delete-key { color: var(--blue); }
    #letters-solve { grid-column: span 2; }
    /* Invisible hit areas reaching half-way into each gap (inset = half gap + 2px border), so taps between keys hit the nearest key. */
    .entry-pad button, #calculator-keys button, .calculator-operators button { position: relative; -webkit-tap-highlight-color: transparent; }
    .entry-pad button::before, #calculator-keys button::before, .calculator-operators button::before { content: ""; position: absolute; background: transparent; }
    .entry-pad button::before { inset: -6px; }
    #calculator-keys button::before { inset: -5px; }
    .calculator-operators button::before { inset: -6px -5px -5px; }
    .keypad-form > .buttons { margin: 0; }
    #letters-solver > .buttons:not(:has(button:not([hidden]))) { display: none; }
    #solver.number-ready, #letters-solver.letter-results, #letters-solver.letters-busy { flex: 0 0 auto; }
    #solver.number-ready #numbers-fieldset, #letters-solver.letters-busy #letters-fieldset { flex: 0 0 auto; }
    #letters-solver.letter-results #letters-fieldset, #letters-solver.letters-busy #letter-pad { display: none; }
    #status:empty, #letters-status:empty { display: none; }
    @media (min-width: 700px) { body { padding: 20px; } main { height: calc(100dvh - 40px); } .card { padding: 16px; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="tabs" role="tablist" aria-label="Elige un reto">
      <button id="numbers-tab" type="button" role="tab" aria-selected="true" aria-controls="numbers-panel">Cifras</button>
      <img src="icons/logo-156.png?v=1" width="78" height="78" alt="" aria-hidden="true" draggable="false">
      <button id="letters-tab" type="button" role="tab" aria-selected="false" aria-controls="letters-panel" tabindex="-1">Letras</button>
    </div>
    <section id="numbers-panel" role="tabpanel" aria-labelledby="numbers-tab">
    <form id="solver" class="card keypad-form" novalidate>
      <input id="numbers" type="hidden" value="">
      <input id="target" type="hidden" value="">
      <fieldset id="numbers-fieldset">
        <div id="number-slots" class="entry-slots" role="group" aria-label="Tus seis n&uacute;meros"></div>
        <button id="number-target-slot" class="entry-target empty" type="button" disabled><span>Objetivo</span><span id="number-target-value">&middot;&middot;&middot;</span></button>
        <div id="number-pad" class="entry-pad number-pad" role="group" aria-label="Teclado num&eacute;rico"></div>
      </fieldset>
      <div id="number-actions" class="buttons" hidden>
        <button id="edit-numbers" type="button" class="secondary">Editar cifras</button>
        <button id="solve-myself" type="button">Resolver yo</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    </section>
    <section id="letters-panel" role="tabpanel" aria-labelledby="letters-tab" hidden>
      <form id="letters-solver" class="card keypad-form" novalidate>
        <input id="letters" type="hidden" value="">
        <fieldset id="letters-fieldset">
          <div id="letter-slots" class="entry-slots" role="group" aria-label="Tus letras"></div>
          <div id="letter-pad" class="entry-pad letter-pad" role="group" aria-label="Abecedario en orden alfab&eacute;tico">
            <button id="letters-solve" type="submit" class="enter-key">Buscar</button>
          </div>
        </fieldset>
        <div class="buttons">
          <button id="letters-edit" type="button" hidden>Cambiar letras</button>
          <button id="letters-cancel" type="button" class="secondary" hidden>Cancelar</button>
        </div>
        <p id="letters-source" class="caveat">Candidatas del diccionario abierto <a href="https://github.com/sbosio/rla-es">RLA-ES</a> (Santiago Bosio y colaboradores), <strong>no verificadas por la RAE</strong> &middot; <a href="data/MPL-1.1.txt">MPL 1.1</a> &middot; <a href="data/README.md">Fuente y alcance</a></p>
        <p id="letters-status" role="status" aria-live="polite"></p>
      </form>
      <section id="letters-result" class="card" aria-labelledby="letters-result-title" hidden>
        <h2 id="letters-result-title">Las candidatas m&aacute;s largas</h2>
        <p id="letters-summary"></p>
        <ul id="letters-words" class="word-list result-scroll" lang="es" tabindex="0" aria-label="Palabras candidatas"></ul>
      </section>
    </section>
    <section id="calculator-panel" hidden aria-labelledby="calculator-title">
      <div class="calculator-toolbar">
        <button id="calculator-back" type="button" class="secondary" aria-label="Volver" title="Volver"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 12 12.5 2.5V8H22v8h-9.5v5.5z"/></svg></button>
        <div class="calculator-goal" role="group" aria-label="Objetivo y distancia">
          <div class="calculator-target"><span id="calculator-title">Objetivo</span><span class="target-line"><strong id="calculator-target"></strong><span id="calculator-distance" role="status" aria-live="polite"></span></span></div>
        </div>
      </div>
      <div class="card calculator-controls">
        <div class="calculator-readout">
        <div id="calculator-display" aria-label="Operaci&oacute;n actual"></div>
        </div>
        <ul id="calculator-originals" class="supplied-numbers" aria-label="Cifras originales y su uso"></ul>
        <div id="calculator-keys" role="group" aria-label="Botones disponibles: cifras y resultados" aria-describedby="key-legend"></div>
        <p id="key-legend" class="key-legend">Botones azules con =: resultados anteriores.</p>
        <div class="calculator-operators" role="group" aria-label="Operaciones">
          <button type="button" data-operator="+" aria-label="Sumar">+</button>
          <button type="button" data-operator="-" aria-label="Restar">&minus;</button>
          <button type="button" data-operator="*" aria-label="Multiplicar">&times;</button>
          <button type="button" data-operator="/" aria-label="Dividir">&divide;</button>
          <button id="calculator-undo" type="button" class="secondary" aria-label="Deshacer" title="Deshacer">&larr;</button>
        </div>
        <p id="calculator-status" role="status" aria-live="polite"></p>
      </div>
      <section class="card" id="calculator-history" aria-labelledby="calculator-history-title">
        <h2 id="calculator-history-title">Pasos</h2>
        <ol id="calculator-steps" class="result-scroll" tabindex="0" aria-label="Pasos realizados"></ol>
      </section>
      <div class="calculator-footer">
        <button id="calculator-auto" type="button">Auto-resolver</button>
      </div>
    </section>
  </main>
  <script src="letters-core.js?v=5"></script>
  <script src="letters-ui.js?v=25"></script>
  <script src="numbers-game.js?v=17"></script>
  <script src="numbers-search.js?v=25"></script>
  <script src="keypad-model.js?v=26"></script>
  <script src="entry-keypads.js?v=26"></script>
  <script src="celebration.js?v=22"></script>
  <script src="calculator-ui.js?v=27"></script>
  <script>
    "use strict";

    document.getElementById("edit-numbers").addEventListener("click", () => {
      document.dispatchEvent(new CustomEvent("editnumberpuzzle"));
    });
    document.getElementById("solver").addEventListener("submit", event => event.preventDefault());
  </script>
  <script src="puzzle-url.js?v=25"></script>
  <script src="puzzle-state.js?v=26"></script>
  <script src="analytics.js?v=2"></script>
  <script data-goatcounter="https://miquelmartin.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
