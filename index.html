  <style>
    :root { color-scheme: light; font: 16px/1.4 system-ui, sans-serif; background: #eef5fb; color: #1d2a44; --ink: #1d2a44; --muted: #3f6fc4; --blue: #3f6fc4; --orange: #f4a77c; --amber: #f6c96b; --line: #2b3a5a; --soft: #f7fafd; --operator: #5b84d1; --target: #e2733a; --result: #8fb0e6; }

    #calculator-current .step-slot { flex: 0 1 auto; min-width: calc(56px * var(--s)); max-width: 40%; height: calc(42px * var(--s)); padding: 0 calc(6px * var(--s)); display: grid; place-items: center; border: 2.5px dashed var(--result); border-radius: 9px; color: #4d6fa8; overflow: hidden; text-overflow: ellipsis; }
    #calculator-current .step-slot.filled { border-style: solid; border-color: var(--line); background: var(--orange); color: var(--ink); }

    #lp-best-word, #lp-best-max { display: block; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    #lp-auto:disabled { opacity: .45; }
    #lp-box { flex: 1 1 0; min-height: 0; padding: 6px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 4px; }
    #lp-status { flex: 0 0 auto; font-size: .8rem; line-height: 1.25; overflow-wrap: anywhere; }

    @keyframes lp-flash { 50% { background: #dbe7fb; border-color: var(--blue); } }
    #lp-current { --s: var(--step-scale, 1); flex: 0 0 calc(56px * var(--s)); height: calc(56px * var(--s)); display: flex; align-items: center; padding: 0 calc(12px * var(--s)); border: 2.5px solid var(--blue); border-radius: 11px; background: #fff; box-shadow: 0 0 0 3px #8fb0e655; font-size: calc(1.9rem * var(--s)); font-weight: 800; letter-spacing: .08em; line-height: 1; color: var(--ink); white-space: nowrap; overflow: hidden; min-width: 0; }
    .lp-caret { flex: 0 0 3px; width: 3px; height: 1em; margin-left: 2px; background: var(--blue); animation: lp-blink 1s steps(1) infinite; }

    @media (prefers-reduced-motion: reduce) { .lp-caret, #lp-words li.flash { animation: none; } }
    .lp-controls { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 0 2px 2px 0; }
    #lp-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: var(--lp-tile-height, 56px); gap: 8px; }

    .calculator-operators button::before { inset: -6px; }
    .keypad-form > .buttons { margin: 0; }
    #solver.number-ready { flex: 0 0 auto; }
    #solver.number-ready #numbers-fieldset { flex: 0 0 auto; }
    #status:empty, #letters-status:empty { display: none; }
    @media (min-width: 700px) { body { padding: 20px; } main { height: calc(100dvh - 40px); } .card { padding: 16px; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="tabs" aria-label="Elige un reto">
      <div class="mode-tabs" role="tablist" aria-label="Elige un reto">
      <button id="numbers-tab" type="button" role="tab" aria-selected="true" aria-controls="numbers-panel">Cifras</button>
      <img src="icons/logo-156.png?v=1" width="78" height="78" alt="" aria-hidden="true" draggable="false">
      <button id="letters-tab" type="button" role="tab" aria-selected="false" aria-controls="letters-panel" tabindex="-1">Letras</button>
      </div>
      <div class="language-control">
        <button id="language-button" type="button" aria-label="Idioma" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu" title="Interfaz y diccionario">ES<svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <div id="language-menu" role="menu" aria-label="Idioma" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" data-language="es" lang="es" tabindex="-1">Espa&ntilde;ol</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-language="fr" lang="fr" tabindex="-1">Fran&ccedil;ais</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-language="en" lang="en" tabindex="-1">English</button>
        </div>
      </div>
    </div>
    <section id="numbers-panel" role="tabpanel" aria-labelledby="numbers-tab">
    <form id="solver" class="card keypad-form" novalidate>
      <input id="numbers" type="hidden" value="">
      <input id="target" type="hidden" value="">
      <fieldset id="numbers-fieldset">
        <div id="number-slots" class="entry-slots" role="group" aria-label="Tus seis n&uacute;meros"></div>
        <button id="number-target-slot" class="entry-target empty" type="button" disabled><span>Objetivo</span><span id="number-target-value">&middot;&middot;&middot;</span></button>
        <div id="number-pad" class="entry-pad number-pad" role="group" aria-label="Teclado num&eacute;rico"></div>
      </fieldset>
      <div id="number-actions" class="buttons" hidden>
        <button id="edit-numbers" type="button" class="secondary">Editar cifras</button>
        <button id="solve-myself" type="button">Resolver yo</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    </section>
    <section id="letters-panel" role="tabpanel" aria-labelledby="letters-tab" hidden>
      <form id="letters-solver" class="card keypad-form" novalidate>
        <input id="letters" type="hidden" value="">
        <fieldset id="letters-fieldset">
          <div id="letter-slots" class="entry-slots" role="group" aria-label="Tus letras"></div>
          <div id="letter-pad" class="entry-pad letter-pad" role="group" aria-label="Abecedario en orden alfab&eacute;tico">
            <button id="letters-solve" type="submit" class="enter-key">Enter</button>
          </div>
        </fieldset>
        <p id="letters-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section id="letters-play" hidden aria-label="Resolver letras">
      <div class="calculator-toolbar">
        <button id="lp-back" type="button" class="secondary" aria-label="Volver" title="Volver"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 12 12.5 2.5V8H22v8h-9.5v5.5z"/></svg></button>
        <div class="calculator-goal" role="group" aria-label="Tu mejor palabra">
          <div class="calculator-target"><span id="lp-best-title">Tu mejor palabra</span><span class="target-line"><strong id="lp-best">&ndash;</strong><span id="lp-best-note"><span id="lp-best-word" role="status" aria-live="polite"></span><span id="lp-best-max"></span></span></span></div>
        </div>
        <button id="lp-auto" type="button">Auto-resolver</button>
      </div>
      <section class="card" id="lp-box" aria-label="Tus palabras" lang="es">
        <p id="lp-status" role="status" aria-live="polite"></p>
        <ol id="lp-words" aria-label="Palabras enviadas"></ol>
        <div id="lp-current" aria-label="Palabra en curso"></div>
      </section>
      <div class="lp-controls">
        <div id="lp-tiles" role="group" aria-label="Tus diez letras"></div>
        <div id="lp-actions" role="group" aria-label="Acciones">
          <button id="lp-delete" type="button" class="secondary" aria-label="Quitar la &uacute;ltima letra" title="Quitar la &uacute;ltima letra">&#9003;</button>
          <button id="lp-submit" type="button" aria-label="Comprobar palabra" title="Comprobar palabra">&#8629;</button>
        </div>
      </div>
    </section>
    <section id="calculator-panel" hidden aria-labelledby="calculator-title">
      <div class="calculator-toolbar">
        <button id="calculator-back" type="button" class="secondary" aria-label="Volver" title="Volver"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 12 12.5 2.5V8H22v8h-9.5v5.5z"/></svg></button>
        <div class="calculator-goal" role="group" aria-label="Objetivo y distancia">
          <div class="calculator-target"><span id="calculator-title">Objetivo</span><span class="target-line"><strong id="calculator-target"></strong><span id="calculator-distance" role="status" aria-live="polite"></span></span></div>
        </div>
        <button id="calculator-auto" type="button">Auto-resolver</button>
      </div>
      <section class="card" id="calculator-history" aria-label="Pasos">
        <p id="calculator-status" role="status" aria-live="polite"></p>
        <ol id="calculator-steps" aria-label="Pasos realizados"></ol>
        <div id="calculator-current" aria-label="Operaci&oacute;n actual"></div>
      </section>
      <div class="calculator-controls">
        <div id="calculator-keys" role="group" aria-label="Botones disponibles: cifras y resultados" aria-describedby="key-legend"></div>
        <p id="key-legend" class="key-legend">Botones azules con =: resultados anteriores.</p>
        <div class="calculator-operators" role="group" aria-label="Operaciones">
          <button type="button" data-operator="+" aria-label="Sumar">+</button>
          <button type="button" data-operator="-" aria-label="Restar">&minus;</button>
          <button type="button" data-operator="*" aria-label="Multiplicar">&times;</button>
          <button type="button" data-operator="/" aria-label="Dividir">&divide;</button>
          <button id="calculator-undo" type="button" class="secondary" aria-label="Deshacer" title="Deshacer">&larr;</button>
        </div>
      </div>
    </section>
  </main>
  <script src="touch-controls.js?v=1"></script>
  <script src="haptics.js?v=1"></script>
  <script src="i18n.js?v=1"></script>

  <script src="letters-ui.js?v=27"></script>
  <script src="numbers-game.js?v=17"></script>
  <script src="numbers-search.js?v=26"></script>
  <script src="keypad-model.js?v=29"></script>
  <script src="entry-keypads.js?v=33"></script>
  <script src="celebration.js?v=22"></script>
  <script src="calculator-ui.js?v=30"></script>
  <script src="letters-play.js?v=3"></script>
  <script>
    "use strict";

    document.getElementById("edit-numbers").addEventListener("click", () => {
      document.dispatchEvent(new CustomEvent("editnumberpuzzle"));
    });
    document.getElementById("solver").addEventListener("submit", event => event.preventDefault());
  </script>

  </body>
